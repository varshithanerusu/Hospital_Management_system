{% extends "base.html" %}

{% block title %}Add Doctor{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-box">

        <h1>Add Doctor</h1>

        <form id="doctorForm">

            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label>Specialization</label>
                <input type="text" id="specialization" required>
            </div>

            <div id="message"></div>

            <div class="form-buttons">

                <button type="submit">
                    Add Doctor
                </button>

                <button
                    type="button"
                    class="cancel-button"
                    onclick="goBack()">
                    Cancel
                </button>

            </div>

        </form>

    </div>

</div>

<script>

const token = localStorage.getItem("access_token");

if (!token) {
    window.location.href = "/login";
}

document.getElementById("doctorForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const specialization =
        document.getElementById("specialization")
        .value.trim();

    if (!name || !specialization) {
        showMessage("Please fill all fields.", "error");
        return;
    }

    try {

        const response = await fetch("/doctors", {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },

            body: JSON.stringify({
                name: name,
                specialization: specialization
            })
        });

        const data = await response.json();

        if (response.ok) {

            showMessage(
                "Doctor added successfully!",
                "success"
            );

            setTimeout(function() {
                window.location.href = "/doctors-page";
            }, 800);

        } else {

            showMessage(
                data.message || "Unable to add doctor.",
                "error"
            );

        }

    } catch (error) {

        showMessage(
            "Unable to connect to server.",
            "error"
        );

    }

});

function goBack() {
    window.location.href = "/doctors-page";
}

function showMessage(message, type) {

    const box = document.getElementById("message");

    box.innerText = message;
    box.className = type;

}

</script>

{% endblock %}
