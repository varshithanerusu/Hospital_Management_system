{% extends "base.html" %}

{% block title %}
Login - Hospital Management System
{% endblock %}


{% block content %}

<div class="login-box">

    <h1>Hospital Management System</h1>

    <h2>Login</h2>

    <form id="loginForm">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

        </div>


        <button type="submit">
            Login
        </button>

    </form>


    <p id="message"></p>

</div>


<script>

document.getElementById("loginForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;


        try {

            const response = await fetch(
                "/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (response.ok) {

                localStorage.setItem(
                    "access_token",
                    data.access_token
                );

                localStorage.setItem(
                    "username",
                    data.user.username
                );

                localStorage.setItem(
                    "role",
                    data.user.role
                );

                document.getElementById("message").innerText =
                    "Login successful!";

                setTimeout(function() {

                    window.location.href = "/dashboard";

                }, 500);

            } else {

                document.getElementById("message").innerText =
                    data.message;

            }

        } catch (error) {

            document.getElementById("message").innerText =
                "Unable to connect to server.";

        }

    }

);

</script>

{% endblock %}
