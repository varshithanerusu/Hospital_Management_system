{% extends "base.html" %}

{% block title %}
Add Patient - Hospital Management System
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-box">

        <h1>Add Patient</h1>

        <p>Enter the patient details below.</p>

        <form id="patientForm">

            <div class="form-group">

                <label for="name">
                    Patient Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter patient name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    placeholder="Enter age"
                    min="1"
                    max="120"
                    required
                >

            </div>


            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select id="gender" required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="contact">
                    Contact
                </label>

                <input
                    type="text"
                    id="contact"
                    placeholder="Enter 10 digit contact number"
                    maxlength="10"
                    required
                >

            </div>


            <div id="message"></div>


            <div class="form-buttons">

                <button type="submit">
                    Add Patient
                </button>

                <button
                    type="button"
                    class="cancel-button"
                    onclick="goBack()">

                    Cancel

                </button>

            </div>

        </form>

    </div>

</div>


<script>

const token = localStorage.getItem("access_token");


// Check login
if (!token) {

    window.location.href = "/login";

}


// Submit form
document.getElementById("patientForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value.trim();

            const age =
                document.getElementById("age").value;

            const gender =
                document.getElementById("gender").value;

            const contact =
                document.getElementById("contact").value.trim();


            // Basic validation
            if (!name || !age || !gender || !contact) {

                showMessage(
                    "Please fill all fields.",
                    "error"
                );

                return;

            }


            if (!/^[0-9]{10}$/.test(contact)) {

                showMessage(
                    "Contact must contain exactly 10 digits.",
                    "error"
                );

                return;

            }


            try {

                const response = await fetch(
                    "/patients",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",

                            "Authorization":
                                "Bearer " + token
                        },

                        body: JSON.stringify({

                            name: name,

                            age: Number(age),

                            gender: gender,

                            contact: contact

                        })
                    }
                );


                const data =
                    await response.json();


                if (response.ok) {

                    showMessage(
                        "Patient added successfully!",
                        "success"
                    );


                    setTimeout(function() {

                        window.location.href =
                            "/patients-page";

                    }, 1000);


                } else {

                    showMessage(
                        data.message ||
                        "Unable to add patient.",
                        "error"
                    );

                }


            } catch (error) {

                showMessage(
                    "Unable to connect to server.",
                    "error"
                );

            }

        }
    );


// Cancel button
function goBack() {

    window.location.href =
        "/patients-page";

}


// Show message
function showMessage(message, type) {

    const messageBox =
        document.getElementById("message");

    messageBox.innerText = message;

    messageBox.className = type;

}

</script>

{% endblock %}
